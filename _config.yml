# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Dan Solomon
description: "Hi, I'm Dan, a Statistics student interested in the intersection of data and business. My portfolio showcases projects where I've used data to solve problems, uncover insights, and understand their potential business impact. Feel free to explore my work and connect with me through LinkedIn below!"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Business Analytics <span style="color:#f58506"> Portfolio </span>
location: "Toronto, ON"
resume_url: /docs/resume.docx
avatar_image: img/IMG_0445bb.jpg

#-------------------------------
# Contact links
linkedln: "https://www.linkedin.com/in/dan-solomon-315632246/" # Add your linkedln handle
github: "https://github.com/#"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


